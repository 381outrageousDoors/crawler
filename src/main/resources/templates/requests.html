<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Request Log — HN Front Page Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/app.css">
    <script src="/theme.js"></script>
    <script src="/webjars/htmx.org/dist/htmx.min.js"></script>
</head>
<body>
<main class="wrap">
<div class="actions">
<a href="/">Stories</a>
<button id="theme-toggle" type="button">Dark mode</button>
</div>
<div th:fragment="view" id="request-view" hx-get="/requests/data"
     hx-trigger="every 30s" hx-target="this" hx-swap="outerHTML">
  <div class="table-scroll">
  <table>
    <thead><tr><th>Timestamp</th><th>Preset / Filter</th><th>Result count</th>
      <th>Duration ms</th><th>Endpoint</th><th>Browser</th></tr></thead>
    <tbody>
      <tr th:each="r : ${rows}">
        <td th:text="${r.time}"></td>
        <td th:text="${r.presetOrFilter}"></td>
        <td th:text="${r.resultCount}"></td>
        <td th:text="${r.durationMs}"></td>
        <td th:text="${r.endpoint}"></td>
        <td th:text="${r.browser}"></td>
      </tr>
    </tbody>
  </table>
  </div>
</div>
</main>
</body>
</html>
