<form hx-post="/scan" hx-target="#stories" hx-swap="innerHTML" hx-disabled-elt="find button">
    <button type="submit">Scan now</button>
</form>
<table>
    <thead><tr><th>#</th><th>Title</th><th>Points</th><th>Comments</th></tr></thead>
    <tbody id="stories" hx-get="/stories" hx-trigger="every 30s" hx-swap="innerHTML">
    <th:block th:replace="~{fragment :: stories}"/>
    </tbody>
</table>
