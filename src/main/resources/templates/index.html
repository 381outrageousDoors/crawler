<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>HN Front Page Tracker</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/app.css">
    <script src="/theme.js"></script>
    <script src="/webjars/htmx.org/dist/htmx.min.js"></script>
</head>
<body>
<main class="wrap">
<div class="actions">
<form hx-post="/scan" hx-target="#story-view" hx-swap="outerHTML" hx-disabled-elt="find button">
    <button type="submit">Reset &amp; Scan</button>
</form>
<button hx-get="/stories?preset=ask1" hx-target="#story-view" hx-swap="outerHTML">Ask 1</button>
<button hx-get="/stories?preset=ask2" hx-target="#story-view" hx-swap="outerHTML">Ask 2</button>
<a href="/requests">Request log</a>
<button id="theme-toggle" type="button">Dark mode</button>
</div>
<div th:replace="~{fragment :: view}"/>
</main>
</body>
</html>
