name: CI + deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      # Testcontainers uses the runner's preinstalled Docker daemon;
      # the local podman env vars are not needed here.
      - name: Run tests
        run: ./mvnw -B test

  deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    container: ghcr.io/railwayapp/cli:latest
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      # Uploads the source; Railway still builds the Dockerfile on its side.
      - name: Deploy to Railway
        run: railway up --environment production --service "${{ vars.RAILWAY_SERVICE }}" --detach
